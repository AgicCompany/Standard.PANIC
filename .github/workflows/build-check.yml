name: build-check

on:
  pull_request:
    branches: [main]

permissions:
  contents: read

concurrency:
  group: build-check-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build-check:
    name: build-check
    runs-on: ubuntu-latest
    env:
      TF_IN_AUTOMATION: "1"
      TF_INPUT: "0"
      TF_PLUGIN_CACHE_DIR: ${{ github.workspace }}/.tf-plugin-cache
    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Setup Terraform
        uses: hashicorp/setup-terraform@v4
        with:
          terraform_version: 1.15.2
          terraform_wrapper: false

      - name: Cache provider plugins
        uses: actions/cache@v6
        with:
          path: ${{ env.TF_PLUGIN_CACHE_DIR }}
          key: tf-plugins-${{ runner.os }}-${{ hashFiles('**/versions.tf', '**/main.tf') }}
          restore-keys: |
            tf-plugins-${{ runner.os }}-

      - name: Terraform format check
        run: terraform fmt -check -recursive

      - name: Template module refs match the latest tags
        run: |
          set -euo pipefail
          stale=0
          while read -r file mod ref; do
            latest=$(git tag -l "${mod}/v*" | sort -V | tail -1)
            if [ "${ref}" != "${latest}" ]; then
              echo "::error file=${file}::${mod} is pinned to ${ref}, latest tag is ${latest:-<none>}"
              stale=1
            fi
          done < <(grep -HoE 'modules/[a-z]+\?ref=[a-z]+/v[0-9]+\.[0-9]+\.[0-9]+' templates/panic-subscription-template/*.tf \
            | sed -E 's|^([^:]+):modules/([a-z]+)\?ref=(.*)$|\1 \2 \3|')
          exit "${stale}"

      - name: docs/thresholds.md is up to date
        run: |
          set -euo pipefail
          pip install --quiet python-hcl2
          python3 scripts/gen-thresholds.py
          git diff --exit-code docs/thresholds.md \
            || { echo "::error file=docs/thresholds.md::Out of date. Run python3 scripts/gen-thresholds.py and commit the result."; exit 1; }

      - name: Terraform validate (roots, modules, examples, template)
        run: |
          set -euo pipefail
          mkdir -p "$TF_PLUGIN_CACHE_DIR"
          mapfile -t dirs < <(find . -type f -name '*.tf' \
            -not -path '*/.terraform/*' \
            -exec dirname {} \; | sort -u)
          echo "Discovered ${#dirs[@]} directories to validate."
          failed=()
          for d in "${dirs[@]}"; do
            echo "::group::validate ${d}"
            if terraform -chdir="${d}" init -backend=false -input=false -no-color \
               && terraform -chdir="${d}" validate -no-color; then
              echo "PASS: ${d}"
            else
              echo "FAIL: ${d}"
              failed+=("${d}")
            fi
            echo "::endgroup::"
          done
          echo "----------------------------------------"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Validation FAILED for ${#failed[@]} dir(s): ${failed[*]}"
            exit 1
          fi
          echo "All ${#dirs[@]} directories passed validate."

      - name: Terraform test
        run: |
          set -euo pipefail
          mapfile -t dirs < <(find . -type f -name '*.tftest.hcl' \
            -not -path '*/.terraform/*' \
            -exec dirname {} \; | sed 's|/tests$||' | sort -u)
          echo "Discovered ${#dirs[@]} directories with tests."
          failed=()
          for d in "${dirs[@]}"; do
            echo "::group::test ${d}"
            if terraform -chdir="${d}" init -backend=false -input=false -no-color \
               && terraform -chdir="${d}" test -no-color; then
              echo "PASS: ${d}"
            else
              echo "FAIL: ${d}"
              failed+=("${d}")
            fi
            echo "::endgroup::"
          done
          echo "----------------------------------------"
          if [ "${#failed[@]}" -gt 0 ]; then
            echo "Tests FAILED for ${#failed[@]} dir(s): ${failed[*]}"
            exit 1
          fi
          echo "All ${#dirs[@]} directories passed tests."
